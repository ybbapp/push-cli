name: Release

on:
  push:
    tags:
      - "alpha-*"
      - "v*"

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64, archive: tar.gz }
          - { goos: darwin, goarch: arm64, archive: tar.gz }
          - { goos: linux, goarch: amd64, archive: tar.gz }
          - { goos: linux, goarch: arm64, archive: tar.gz }
          - { goos: linux, goarch: riscv64, archive: tar.gz }
          - { goos: windows, goarch: amd64, archive: zip }
          - { goos: windows, goarch: arm64, archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p stage dist
          binary=push-cli
          if [[ "$GOOS" == windows ]]; then binary=push-cli.exe; fi
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "stage/${binary}" ./cmd
          archive="push-cli-${TAG}-${GOOS}-${GOARCH}.${{ matrix.archive }}"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            (cd stage && zip "../dist/${archive}" "${binary}")
          else
            tar -czf "dist/${archive}" -C stage "${binary}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum push-cli-* > checksums.txt
          args=("$TAG" --title "$TAG" --verify-tag --notes "Prebuilt push-cli binaries. See README for installation and use.")
          if [[ "$TAG" == alpha-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}" ./*

  publish-npm:
    name: Publish npm package with OIDC
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@latest
      - name: Check initial npm package
        id: package
        run: |
          if npm view @ybbapp/push-cli version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "npm package is not initialized yet; GitHub Release and GHCR publishing will continue."
          fi
      - name: Set npm version and publish
        if: steps.package.outputs.exists == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^alpha-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            npm_version="${BASH_REMATCH[1]}-alpha.0"
            npm_tag=alpha
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            npm_version="${BASH_REMATCH[1]}"
            npm_tag=latest
          else
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi
          existing_version="$(npm view "@ybbapp/push-cli@${npm_version}" version 2>/dev/null || true)"
          if [[ "$existing_version" == "$npm_version" ]]; then
            echo "@ybbapp/push-cli@${npm_version} already exists; skipping immutable version."
            exit 0
          fi
          npm pkg set "version=${npm_version}"
          npm publish --access public --tag "$npm_tag"

  publish-container:
    name: Publish Docker image to GHCR
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/push-cli
          tags: |
            type=ref,event=tag
            type=raw,value=alpha,enable=${{ startsWith(github.ref_name, 'alpha-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') }}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
